[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# D (docstrings) is dropped deliberately - the guard bright-line-denies
# docstrings on test functions, so the two rule sets would fight.
select = ["E", "F", "I", "UP", "B", "ERA", "T20"]

[tool.ruff.lint.per-file-ignores]
# The CLI writes its findings to stdout/stderr via print().
"comment_intent_guard.py" = ["T20"]
# Hook scripts emit their JSON payload to stdout via print().
"hooks/*.py" = ["T20"]

[tool.mutmut]
source_paths = [
    "comment_intent_guard.py",
    "hooks/bash_backstop.py",
    "hooks/session_start.py",
    "hooks/stamps.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = [
    "--ignore=tests/test_init.py",
    "--deselect=tests/test_public_api.py::test_declared_surface_matches_the_modules_actual_public_surface",
]
also_copy = [
    "bin",
    "hooks/hooks.json",
    "init.sh",
    "templates",
    "skills",
    ".claude-plugin",
    ".github",
    "README.md",
    "docs",
    "LICENSE",
    "pytest.ini",
]
use_git_change_detection = false
